<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="480px" height="339px" viewBox="-0.5 -0.5 480 339">
    <title>Normalized data split across separate Customer and Order tables, versus denormalized data combined into a single CustomerOrder table</title>
    <g>
        <text x="120" y="16" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Normalized</text>
        <text x="360" y="16" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Denormalized</text>
        <path d="M 240 1 L 240 338" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="31" y="41" width="180" height="126" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 31 73 L 211 73" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="121" y="57" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Customer</text>
        <text x="121" y="91" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor" text-decoration="underline">customerId</text>
        <text x="121" y="111" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">name</text>
        <text x="121" y="131" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">email</text>
        <text x="121" y="151" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">phone</text>
        <rect x="31" y="191" width="180" height="146" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 31 223 L 211 223" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="121" y="207" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Order</text>
        <text x="121" y="241" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor" text-decoration="underline">orderId</text>
        <text x="121" y="261" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">customerId</text>
        <text x="121" y="281" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">date</text>
        <text x="121" y="301" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">quantity</text>
        <text x="121" y="321" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">price</text>
        <rect x="271" y="41" width="180" height="186" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 271 73 L 451 73" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="361" y="57" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">CustomerOrder</text>
        <text x="361" y="91" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor" text-decoration="underline">id</text>
        <text x="361" y="111" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">name</text>
        <text x="361" y="131" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">email</text>
        <text x="361" y="151" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">phone</text>
        <text x="361" y="171" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">date</text>
        <text x="361" y="191" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">quantity</text>
        <text x="361" y="211" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">price</text>
    </g>
</svg>
