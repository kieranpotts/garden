<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="320px" height="259px" viewBox="-0.5 -0.5 320 259">
    <title>A Venn diagram of the CAP theorem's three properties and their pairwise combinations, CP, AP, and CA</title>
    <g>
        <circle cx="110" cy="90" r="80" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="210" cy="90" r="80" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="160" cy="177" r="80" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="80" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Consistency</text>
        <text x="240" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Availability</text>
        <text x="160" y="215" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">
            <tspan x="160" dy="-8">Partition</tspan>
            <tspan x="160" dy="16">Tolerance</tspan>
        </text>
        <text x="160" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">CA</text>
        <text x="123" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">CP</text>
        <text x="197" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">AP</text>
    </g>
</svg>
