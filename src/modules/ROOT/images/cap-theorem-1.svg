<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="211px" height="201px" viewBox="-0.5 -0.5 211 201">
    <title>A Venn diagram of the CAP theorem's three properties and their pairwise combinations, CP, AP, and CA</title>
    <defs/>
    <g>
        <ellipse cx="105" cy="140" rx="60" ry="60" fill-opacity="0.75" fill="#fff2cc" stroke="#d6b656" stroke-opacity="0.75" pointer-events="all"/>
        <text x="105" y="184" fill="currentColor" font-family="inherit" font-size="12px" text-anchor="middle" dominant-baseline="central">
            <tspan x="105" dy="-0.6em">Partition</tspan>
            <tspan x="105" dy="1.2em">Tolerance</tspan>
        </text>
        <ellipse cx="60" cy="60" rx="60" ry="60" fill-opacity="0.75" fill="#f8cecc" stroke="#b85450" stroke-opacity="0.75" pointer-events="all"/>
        <text x="15" y="64" fill="currentColor" font-family="inherit" font-size="12px" dominant-baseline="central">Consistency</text>
        <ellipse cx="150" cy="60" rx="60" ry="60" fill-opacity="0.75" fill="#dae8fc" stroke="#6c8ebf" stroke-opacity="0.75" pointer-events="all"/>
        <text x="195" y="64" fill="currentColor" font-family="inherit" font-size="12px" text-anchor="end" dominant-baseline="central">Availability</text>
        <rect x="75" y="45" width="60" height="30" fill="none" stroke="none" pointer-events="all"/>
        <text x="105" y="64" fill="currentColor" font-family="inherit" font-size="12px" text-anchor="middle" dominant-baseline="central" font-weight="bold">CA</text>
        <rect x="105" y="90" width="60" height="30" fill="none" stroke="none" pointer-events="all"/>
        <text x="135" y="109" fill="currentColor" font-family="inherit" font-size="12px" text-anchor="middle" dominant-baseline="central" font-weight="bold">AP</text>
        <rect x="45" y="90" width="60" height="30" fill="none" stroke="none" pointer-events="all"/>
        <text x="75" y="109" fill="currentColor" font-family="inherit" font-size="12px" text-anchor="middle" dominant-baseline="central" font-weight="bold">CP</text>
    </g>
</svg>
