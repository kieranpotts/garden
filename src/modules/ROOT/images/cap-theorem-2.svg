<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="251px" height="191px" viewBox="-0.5 -0.5 251 191">
    <title>A Venn diagram of the CAP theorem showing the choice between consistency and availability once partition tolerance is assumed</title>
    <defs/>
    <g>
        <ellipse cx="125" cy="130" rx="60" ry="60" fill-opacity="0.75" fill="#fff2cc" stroke="#d6b656" stroke-opacity="0.75" pointer-events="all"/>
        <text x="125" y="164" fill="currentColor" font-family="inherit" font-size="12px" text-anchor="middle" dominant-baseline="central">
            <tspan x="125" dy="-0.6em">Partition</tspan>
            <tspan x="125" dy="1.2em">Tolerance</tspan>
        </text>
        <ellipse cx="60" cy="60" rx="60" ry="60" fill-opacity="0.75" fill="#f8cecc" stroke="#b85450" stroke-opacity="0.75" pointer-events="all"/>
        <text x="60" y="42" fill="currentColor" font-family="inherit" font-size="12px" text-anchor="middle" dominant-baseline="central">Consistency</text>
        <ellipse cx="190" cy="60" rx="60" ry="60" fill-opacity="0.75" fill="#dae8fc" stroke="#6c8ebf" stroke-opacity="0.75" pointer-events="all"/>
        <text x="190" y="42" fill="currentColor" font-family="inherit" font-size="12px" text-anchor="middle" dominant-baseline="central">Availability</text>
        <rect x="125" y="80" width="60" height="30" fill="none" stroke="none" pointer-events="all"/>
        <text x="155" y="99" fill="currentColor" font-family="inherit" font-size="12px" text-anchor="middle" dominant-baseline="central" font-weight="bold">AP</text>
        <rect x="65" y="80" width="60" height="30" fill="none" stroke="none" pointer-events="all"/>
        <text x="95" y="99" fill="currentColor" font-family="inherit" font-size="12px" text-anchor="middle" dominant-baseline="central" font-weight="bold">CP</text>
    </g>
</svg>
