<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="320px" height="242px" viewBox="-0.5 -0.5 320 242">
    <title>A Venn diagram of the CAP theorem showing the choice between consistency and availability once partition tolerance is assumed</title>
    <g>
        <circle cx="78" cy="85" r="75" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="242" cy="85" r="75" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="160" cy="165" r="75" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="70" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Consistency</text>
        <text x="250" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Availability</text>
        <text x="160" y="205" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">
            <tspan x="160" dy="-8">Partition</tspan>
            <tspan x="160" dy="16">Tolerance</tspan>
        </text>
        <text x="119" y="125" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">CP</text>
        <text x="201" y="125" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">AP</text>
    </g>
</svg>
