<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="641px" height="152px" viewBox="-0.5 -0.5 641 152">
    <title>A cache-aside strategy, where the application checks the cache, reads from the database on a miss, and writes the result to the cache itself</title>
    <g>
        <rect x="1" y="31" width="120" height="110" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="61" y="86" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Cache</text>
        <rect x="261" y="31" width="120" height="110" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="321" y="86" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Application</text>
        <path d="M 521 33 A 59 12 0 0 1 639 33 L 639 139 A 59 12 0 0 1 521 139 Z" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 521 33 A 59 12 0 0 0 639 33" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="580" y="91" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Database</text>
        <path d="M 259 51 L 132 51" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 123 51 L 133 46 L 133 56 Z" fill="currentColor" stroke="none"/>
        <text x="191" y="39" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">1. Check Cache</text>
        <path d="M 123 86 L 250 86" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 259 86 L 249 91 L 249 81 Z" fill="currentColor" stroke="none"/>
        <text x="191" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">2. Miss</text>
        <path d="M 259 121 L 132 121" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 123 121 L 133 116 L 133 126 Z" fill="currentColor" stroke="none"/>
        <text x="191" y="109" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">5. Write</text>
        <path d="M 383 51 L 510 51" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 519 51 L 509 56 L 509 46 Z" fill="currentColor" stroke="none"/>
        <text x="451" y="39" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">3. Read</text>
        <path d="M 519 86 L 392 86" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 383 86 L 393 81 L 393 91 Z" fill="currentColor" stroke="none"/>
        <text x="451" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">4. Return Data</text>
    </g>
</svg>
