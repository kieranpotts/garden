<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="182px" height="182px" viewBox="-0.5 -0.5 182 182">
    <title>Concentric Docker image layers, from the Ubuntu base image up through JDK7 to the VoltDB application layer</title>
    <defs/>
    <g>
        <ellipse cx="91" cy="91" rx="90" ry="90" fill="light-dark(#ffffff, #141414)" stroke="currentColor" stroke-width="2" pointer-events="all"/>
        <g transform="translate(-0.5 -0.5)">
            <text x="91" y="22" font-size="14px" text-anchor="middle" font-weight="bold" fill="currentColor" font-family="inherit">VoltDB</text>
        </g>
        <ellipse cx="91" cy="91" rx="60" ry="60" fill="light-dark(#ffffff, #141414)" stroke="currentColor" stroke-width="2" pointer-events="all"/>
        <g transform="translate(-0.5 -0.5)">
            <text x="91" y="52" font-size="14px" text-anchor="middle" font-weight="bold" fill="currentColor" font-family="inherit">JDK7</text>
        </g>
        <ellipse cx="91" cy="91" rx="30" ry="30" fill="light-dark(#ffffff, #141414)" stroke="currentColor" stroke-width="2" pointer-events="all"/>
        <g transform="translate(-0.5 -0.5)">
            <text x="91" y="95" font-size="14px" text-anchor="middle" font-weight="bold" fill="currentColor" font-family="inherit" dominant-baseline="central">Ubuntu</text>
        </g>
    </g>
</svg>
