<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="620px" height="162px" viewBox="-0.5 -0.5 620 162">
    <title>A timeline of domain events triggering each other, from End of Month through to Invoice Prepared</title>
    <!-- Colors carry meaning here: they are the standard Event Storming sticky-note colors. Each uses a hex attribute as a fallback, overridden by a light-dark() style for dark mode. -->
    <g>
        <text x="30" y="16" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Time</text>
        <path d="M 62 16 L 601 16" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 610 16 L 600 21 L 600 11 Z" fill="currentColor" stroke="none"/>
        <path d="M 10 40 L 100 40 L 130 70 L 130 160 L 10 160 Z" fill="#f0a30a" stroke="#bd7000" stroke-width="2" style="fill: light-dark(rgb(240, 163, 10), rgb(154, 88, 0)); stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        <path d="M 100 40 L 100 70 L 130 70" fill="none" stroke="#bd7000" stroke-width="2" style="stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        <text x="70" y="92" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">End of Month</text>
        <path d="M 170 40 L 260 40 L 290 70 L 290 160 L 170 160 Z" fill="#f0a30a" stroke="#bd7000" stroke-width="2" style="fill: light-dark(rgb(240, 163, 10), rgb(154, 88, 0)); stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        <path d="M 260 40 L 260 70 L 290 70" fill="none" stroke="#bd7000" stroke-width="2" style="stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        <text x="230" y="92" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="230" dy="-16">Billable</tspan>
            <tspan x="230" dy="16">Amount</tspan>
            <tspan x="230" dy="16">Calculated</tspan>
        </text>
        <path d="M 330 40 L 420 40 L 450 70 L 450 160 L 330 160 Z" fill="#f0a30a" stroke="#bd7000" stroke-width="2" style="fill: light-dark(rgb(240, 163, 10), rgb(154, 88, 0)); stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        <path d="M 420 40 L 420 70 L 450 70" fill="none" stroke="#bd7000" stroke-width="2" style="stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        <text x="390" y="92" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="390" dy="-16">Billable</tspan>
            <tspan x="390" dy="16">Amount</tspan>
            <tspan x="390" dy="16">Verified</tspan>
        </text>
        <path d="M 490 40 L 580 40 L 610 70 L 610 160 L 490 160 Z" fill="#f0a30a" stroke="#bd7000" stroke-width="2" style="fill: light-dark(rgb(240, 163, 10), rgb(154, 88, 0)); stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        <path d="M 580 40 L 580 70 L 610 70" fill="none" stroke="#bd7000" stroke-width="2" style="stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        <text x="550" y="92" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="550" dy="-8">Invoice</tspan>
            <tspan x="550" dy="16">Prepared</tspan>
        </text>
        <circle cx="105" cy="135" r="15" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 105 124 L 105 135 L 97 135" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
</svg>
