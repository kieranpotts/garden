<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="619px" height="171px" viewBox="-0.5 -0.5 619 171">
    <title>A timeline of domain events triggering each other, from End of Month through to Invoice Prepared</title>
    <defs/>
    <g>
        <g>
            <path d="M 10 50 L 100 50 L 130 80 L 130 170 L 10 170 L 10 50 Z" fill="#f0a30a" stroke="#bd7000" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(240, 163, 10), rgb(154, 88, 0)); stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
            <path d="M 100 50 L 100 80 L 130 80 Z" fill-opacity="0.05" fill="currentColor" stroke="none" pointer-events="all"/>
            <path d="M 100 50 L 100 80 L 130 80" fill="none" stroke="#bd7000" stroke-miterlimit="10" pointer-events="all" style="stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        </g>
        <g>
            <g transform="translate(-0.5 -0.5)">
                <text x="20" y="81" font-size="16px" font-weight="bold" fill="currentColor" font-family="inherit">END OF MONTH</text>
            </g>
        </g>
        <g>
            <path d="M 170 50 L 260 50 L 290 80 L 290 170 L 170 170 L 170 50 Z" fill="#f0a30a" stroke="#bd7000" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(240, 163, 10), rgb(154, 88, 0)); stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
            <path d="M 260 50 L 260 80 L 290 80 Z" fill-opacity="0.05" fill="currentColor" stroke="none" pointer-events="all"/>
            <path d="M 260 50 L 260 80 L 290 80" fill="none" stroke="#bd7000" stroke-miterlimit="10" pointer-events="all" style="stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        </g>
        <g>
            <g transform="translate(-0.5 -0.5)">
                <text x="180" y="81" font-size="16px" font-weight="bold" fill="currentColor" font-family="inherit">
                    <tspan x="180" dy="0">BILLABLE</tspan>
                    <tspan x="180" dy="1.2em">AMOUNT</tspan>
                    <tspan x="180" dy="1.2em">CALCULATED</tspan>
                </text>
            </g>
        </g>
        <g>
            <path d="M 330 50 L 420 50 L 450 80 L 450 170 L 330 170 L 330 50 Z" fill="#f0a30a" stroke="#bd7000" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(240, 163, 10), rgb(154, 88, 0)); stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
            <path d="M 420 50 L 420 80 L 450 80 Z" fill-opacity="0.05" fill="currentColor" stroke="none" pointer-events="all"/>
            <path d="M 420 50 L 420 80 L 450 80" fill="none" stroke="#bd7000" stroke-miterlimit="10" pointer-events="all" style="stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        </g>
        <g>
            <g transform="translate(-0.5 -0.5)">
                <text x="340" y="81" font-size="16px" font-weight="bold" fill="currentColor" font-family="inherit">
                    <tspan x="340" dy="0">BILLABLE</tspan>
                    <tspan x="340" dy="1.2em">AMOUNT</tspan>
                    <tspan x="340" dy="1.2em">VERIFIED</tspan>
                </text>
            </g>
        </g>
        <g>
            <path d="M 490 50 L 580 50 L 610 80 L 610 170 L 490 170 L 490 50 Z" fill="#f0a30a" stroke="#bd7000" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(240, 163, 10), rgb(154, 88, 0)); stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
            <path d="M 580 50 L 580 80 L 610 80 Z" fill-opacity="0.05" fill="currentColor" stroke="none" pointer-events="all"/>
            <path d="M 580 50 L 580 80 L 610 80" fill="none" stroke="#bd7000" stroke-miterlimit="10" pointer-events="all" style="stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        </g>
        <g>
            <g transform="translate(-0.5 -0.5)">
                <text x="500" y="81" font-size="16px" font-weight="bold" fill="currentColor" font-family="inherit">
                    <tspan x="500" dy="0">INVOICE</tspan>
                    <tspan x="500" dy="1.2em">PREPARED</tspan>
                </text>
            </g>
        </g>
        <g>
            <ellipse cx="105" cy="145" rx="15" ry="15" fill="none" stroke="currentColor" stroke-width="2" pointer-events="all"/>
            <path d="M 105 131.5 L 105 145 L 97.5 145" fill="none" stroke="currentColor" stroke-width="2" stroke-miterlimit="10" pointer-events="all"/>
        </g>
        <g>
            <rect x="0" y="0" width="60" height="30" fill="none" stroke="none" pointer-events="all"/>
        </g>
        <g>
            <g transform="translate(-0.5 -0.5)">
                <text x="30" y="21" font-size="20px" text-anchor="middle" font-weight="bold" fill="currentColor" font-family="inherit" dominant-baseline="central">time</text>
            </g>
        </g>
        <g>
            <path d="M 60 15 L 603.63 19.94" fill="none" stroke="currentColor" stroke-miterlimit="10" pointer-events="stroke"/>
            <path d="M 608.88 19.99 L 601.85 23.43 L 603.63 19.94 L 601.91 16.43 Z" fill="currentColor" stroke="currentColor" stroke-miterlimit="10" pointer-events="all"/>
        </g>
    </g>
</svg>
