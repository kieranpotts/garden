<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="601px" height="182px" viewBox="-0.5 -0.5 601 182">
    <title>A producer sending messages through a queue to a consumer, with messages that fail processing diverted to a dead letter queue</title>
