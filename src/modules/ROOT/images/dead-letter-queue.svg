        <rect x="1" y="31" width="120" height="40" fill="none" stroke="currentColor" stroke-width="2" rx="8" ry="8"/>
        <text x="61" y="51" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Producer</text>
        <path d="M 123 51 L 210 51" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 219 51 L 209 56 L 209 46 Z" fill="currentColor" stroke="none"/>
        <path d="M 231 31 L 371 31 A 10 20 0 0 1 371 71 L 231 71 A 10 20 0 0 1 231 31 Z" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 371 31 A 10 20 0 0 0 371 71" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="301" y="14" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Queue</text>
        <path d="M 383 51 L 468 51" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 477 51 L 467 56 L 467 46 Z" fill="currentColor" stroke="none"/>
        <rect x="479" y="31" width="120" height="40" fill="none" stroke="currentColor" stroke-width="2" rx="8" ry="8"/>
        <text x="539" y="51" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Consumer</text>
        <path d="M 301 71 L 301 161 L 370 161" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <path d="M 379 161 L 369 166 L 369 156 Z" fill="currentColor" stroke="none"/>
        <path d="M 391 141 L 551 141 A 10 20 0 0 1 551 181 L 391 181 A 10 20 0 0 1 391 141 Z" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 551 141 A 10 20 0 0 0 551 181" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="471" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Dead Letter Queue (DLQ)</text>
    </g>
</svg>
