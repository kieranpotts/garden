<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="600px" height="429px" viewBox="-0.5 -0.5 600 429">
    <title>A balance scale weighing performance and availability against data consistency and storage, illustrating that system design is about trade-offs</title>
    <g>
        <text x="300" y="20" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">
            <tspan x="300" dy="-8">System design is about trade-offs, in this case,</tspan>
            <tspan x="300" dy="16">performance and availability vs. data consistency and storage.</tspan>
        </text>
        <path d="M 100 130 L 500 50" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="300" cy="90" r="12" fill="currentColor" stroke="none"/>
        <path d="M 300 102 L 300 420" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="120" y="420" width="360" height="8" fill="currentColor" stroke="none"/>
        <path d="M 20 300 L 100 130 L 180 300" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 10 300 Q 100 322 190 300" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="50" y="242" width="100" height="26" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <text x="100" y="255" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Performance</text>
        <rect x="50" y="270" width="100" height="26" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <text x="100" y="283" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Availability</text>
        <path d="M 420 220 L 500 50 L 580 220" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 410 220 Q 500 242 590 220" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="460" y="146" width="80" height="26" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <text x="500" y="159" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Storage</text>
        <rect x="445" y="176" width="110" height="40" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <text x="500" y="196" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="500" dy="-8">Data</tspan>
            <tspan x="500" dy="16">Consistency</tspan>
        </text>
    </g>
</svg>
