<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="320px" height="320px" viewBox="-0.5 -0.5 320 320">
    <title>Concentric Docker image layers, from the Ubuntu base image up through JDK 7 to the VoltDB application layer</title>
    <g>
        <circle cx="160" cy="160" r="159" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <text x="160" y="28" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">VoltDB</text>
        <circle cx="160" cy="160" r="106" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <text x="160" y="81" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">JDK 7</text>
        <circle cx="160" cy="160" r="53" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <text x="160" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Ubuntu</text>
    </g>
</svg>
