<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="502px" height="416px" viewBox="-0.5 -0.5 502 416">
    <title>Two VMs each virtualizing a full guest OS versus containers sharing one container engine and host OS kernel</title>
    <g>
        <rect x="1" y="1" width="110" height="234" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="56" y="17" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">VM 1</text>
        <rect x="11" y="31" width="90" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="56" y="51" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">App</text>
        <rect x="11" y="81" width="90" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="56" y="101" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Bins/Libs</text>
        <rect x="11" y="131" width="90" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="56" y="151" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Guest OS</text>
        <rect x="11" y="181" width="90" height="44" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <text x="56" y="203" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="56" dy="-8">Virtual</tspan>
            <tspan x="56" dy="16">Kernel</tspan>
        </text>
        <rect x="121" y="1" width="110" height="234" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="176" y="17" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">VM 2</text>
        <rect x="131" y="31" width="90" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="176" y="51" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">App</text>
        <rect x="131" y="81" width="90" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="176" y="101" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Bins/Libs</text>
        <rect x="131" y="131" width="90" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="176" y="151" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Guest OS</text>
        <rect x="131" y="181" width="90" height="44" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <text x="176" y="203" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="176" dy="-8">Virtual</tspan>
            <tspan x="176" dy="16">Kernel</tspan>
        </text>
        <rect x="1" y="245" width="230" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="116" y="265" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Hypervisor</text>
        <rect x="1" y="295" width="230" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="116" y="315" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">(Host OS)</text>
        <rect x="1" y="345" width="230" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="116" y="365" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Infrastructure</text>
        <text x="116" y="405" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Virtualization</text>
        <rect x="271" y="105" width="110" height="130" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="326" y="121" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Container 1</text>
        <rect x="281" y="135" width="90" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="326" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">App</text>
        <rect x="281" y="185" width="90" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="326" y="205" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Bins/Libs</text>
        <rect x="391" y="105" width="110" height="130" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="446" y="121" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Container 2</text>
        <rect x="401" y="135" width="90" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="446" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">App</text>
        <rect x="401" y="185" width="90" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="446" y="205" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Bins/Libs</text>
        <rect x="271" y="245" width="230" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="386" y="265" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Container Engine</text>
        <rect x="271" y="295" width="230" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="328" y="315" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Host OS</text>
        <rect x="386" y="301" width="104" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <text x="438" y="315" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Host Kernel</text>
        <rect x="271" y="345" width="230" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="386" y="365" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Infrastructure</text>
        <text x="386" y="405" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Containerization</text>
