<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="352px" height="282px" viewBox="-0.5 -0.5 352 282">
    <title>Event-storming sticky notes for a user issuing a command that leads to a domain event and a read model</title>
    <!-- Colors carry meaning here: they are the standard Event Storming sticky-note colors. Each uses a hex attribute as a fallback, overridden by a light-dark() style for dark mode. -->
    <g>
        <path d="M 231 1 L 321 1 L 351 31 L 351 121 L 231 121 Z" fill="#f0a30a" stroke="#bd7000" stroke-width="2" style="fill: light-dark(rgb(240, 163, 10), rgb(154, 88, 0)); stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        <path d="M 321 1 L 321 31 L 351 31" fill="none" stroke="#bd7000" stroke-width="2" style="stroke: light-dark(rgb(189, 112, 0), rgb(193, 127, 31));"/>
        <text x="291" y="61" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Domain Event</text>
        <path d="M 151 61 L 222 61" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 231 61 L 221 66 L 221 56 Z" fill="currentColor" stroke="none"/>
        <path d="M 31 1 L 121 1 L 151 31 L 151 121 L 31 121 Z" fill="#65d0ff" stroke="#006eaf" stroke-width="2" style="fill: light-dark(rgb(101, 208, 255), rgb(0, 91, 131)); stroke: light-dark(rgb(0, 110, 175), rgb(81, 175, 231));"/>
        <path d="M 121 1 L 121 31 L 151 31" fill="none" stroke="#006eaf" stroke-width="2" style="stroke: light-dark(rgb(0, 110, 175), rgb(81, 175, 231));"/>
        <text x="91" y="41" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Command</text>
        <path d="M 1 51 L 41 51 L 71 81 L 71 151 L 1 151 Z" fill="#ffff88" stroke="currentColor" stroke-width="2" style="fill: light-dark(rgb(255, 255, 136), rgb(33, 33, 0));"/>
        <path d="M 41 51 L 41 81 L 71 81" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="36" cy="78" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 36 83 L 36 100 M 26 87 L 46 87 M 36 100 L 26 113 M 36 100 L 46 113" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="36" y="135" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">User</text>
        <path d="M 111 161 L 201 161 L 231 191 L 231 281 L 111 281 Z" fill="#cdeb8b" stroke="currentColor" stroke-width="2" style="fill: light-dark(rgb(205, 235, 139), rgb(32, 58, 0));"/>
        <path d="M 201 161 L 201 191 L 231 191" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="171" y="221" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Read Model</text>
    </g>
</svg>
