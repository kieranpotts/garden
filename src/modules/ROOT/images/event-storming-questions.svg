<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="320px" height="122px" viewBox="-0.5 -0.5 320 122">
    <title>A pink hotspot sticky note flagging an open question about pricing strategy</title>
    <!-- Colors carry meaning here: they are the standard Event Storming sticky-note colors. Each uses a hex attribute as a fallback, overridden by a light-dark() style for dark mode. -->
    <g>
        <path d="M 100 1 L 190 1 L 220 31 L 220 121 L 100 121 Z" fill="#ff85dc" stroke="#a50040" stroke-width="2" style="fill: light-dark(rgb(255, 133, 220), rgb(173, 68, 143)); stroke: light-dark(rgb(165, 0, 64), rgb(255, 169, 224));"/>
        <path d="M 190 1 L 190 31 L 220 31" fill="none" stroke="#a50040" stroke-width="2" style="stroke: light-dark(rgb(165, 0, 64), rgb(255, 169, 224));"/>
        <text x="160" y="61" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="160" dy="-16">What is the</tspan>
            <tspan x="160" dy="16">pricing</tspan>
            <tspan x="160" dy="16">strategy?</tspan>
        </text>
    </g>
</svg>
