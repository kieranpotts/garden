<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="121px" height="121px" viewBox="-0.5 -0.5 121 121">
    <title>A pink hotspot sticky note flagging an open question about pricing strategy</title>
    <defs/>
    <g>
        <g>
            <path d="M 0 0 L 90 0 L 120 30 L 120 120 L 0 120 L 0 0 Z" fill="#ff85dc" stroke="#a50040" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(255, 133, 220), rgb(173, 68, 143)); stroke: light-dark(rgb(165, 0, 64), rgb(255, 169, 224));"/>
            <path d="M 90 0 L 90 30 L 120 30 Z" fill-opacity="0.05" fill="currentColor" stroke="none" pointer-events="all"/>
            <path d="M 90 0 L 90 30 L 120 30" fill="none" stroke="#a50040" stroke-miterlimit="10" pointer-events="all" style="stroke: light-dark(rgb(165, 0, 64), rgb(255, 169, 224));"/>
        </g>
        <g>
            <g transform="translate(-0.5 -0.5)">
                <text x="10" y="31" font-size="16px" font-weight="bold" fill="currentColor" font-family="inherit">
                    <tspan x="10" dy="0">WHAT IS THE</tspan>
                    <tspan x="10" dy="1.2em">PRICING</tspan>
                    <tspan x="10" dy="1.2em">STRATEGY?</tspan>
                </text>
            </g>
        </g>
    </g>
</svg>
