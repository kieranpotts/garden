<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="600px" height="332px" viewBox="-0.5 -0.5 600 332">
    <title>Sequence diagrams contrasting a synchronous client that waits for the server's response with an asynchronous client that continues working until the response arrives</title>
    <g>
        <text x="140" y="12" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Synchronous</text>
        <rect x="15" y="31" width="90" height="36" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="60" y="49" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Client</text>
        <rect x="175" y="31" width="90" height="36" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="220" y="49" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Server</text>
        <path d="M 60 67 L 60 331" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 220 67 L 220 331" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="55" y="87" width="10" height="50" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <path d="M 65 131 L 206 131" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 215 131 L 205 136 L 205 126 Z" fill="currentColor" stroke="none"/>
        <text x="140" y="119" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Request</text>
        <rect x="215" y="131" width="10" height="110" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <path d="M 215 235 L 74 235" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 65 235 L 75 230 L 75 240 Z" fill="currentColor" stroke="none"/>
        <text x="140" y="251" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Response</text>
        <rect x="55" y="235" width="10" height="50" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <text x="140" y="183" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">
            <tspan x="140" dy="-8">Waiting for</tspan>
            <tspan x="140" dy="16">Response</tspan>
        </text>
        <text x="460" y="12" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Asynchronous</text>
        <rect x="335" y="31" width="90" height="36" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="380" y="49" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Client</text>
        <rect x="495" y="31" width="90" height="36" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="540" y="49" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Server</text>
        <path d="M 380 67 L 380 331" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 540 67 L 540 331" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="375" y="87" width="10" height="50" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <path d="M 385 131 L 526 131" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 535 131 L 525 136 L 525 126 Z" fill="currentColor" stroke="none"/>
        <text x="460" y="119" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Request</text>
        <rect x="535" y="131" width="10" height="90" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <rect x="375" y="141" width="10" height="160" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2"/>
        <path d="M 535 215 L 394 215" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 385 215 L 395 210 L 395 220 Z" fill="currentColor" stroke="none"/>
        <text x="460" y="231" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">Response</text>
        <text x="460" y="173" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">
            <tspan x="460" dy="-8">Continue</tspan>
            <tspan x="460" dy="16">Working</tspan>
        </text>
    </g>
</svg>
