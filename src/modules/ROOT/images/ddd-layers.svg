<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="320px" height="282px" viewBox="-0.5 -0.5 320 282">
    <title>The domain-driven design layers, interface, application, domain, and infrastructure, each depending on the layer below, with the application layer also depending directly on infrastructure</title>
