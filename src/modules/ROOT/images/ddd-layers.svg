        <rect x="41" y="1" width="200" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="141" y="21" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Interface</text>
        <path d="M 141 43 L 141 70" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <path d="M 141 79 L 136 69 L 146 69 Z" fill="currentColor" stroke="none"/>
        <rect x="41" y="81" width="200" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="141" y="101" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Application</text>
        <path d="M 141 123 L 141 150" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <path d="M 141 159 L 136 149 L 146 149 Z" fill="currentColor" stroke="none"/>
