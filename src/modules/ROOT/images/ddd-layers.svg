        <path d="M 141 203 L 141 230" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <path d="M 141 239 L 136 229 L 146 229 Z" fill="currentColor" stroke="none"/>
        <rect x="41" y="241" width="200" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="141" y="261" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Infrastructure</text>
        <path d="M 241 101 L 291 101 L 291 261 L 252 261" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/>
        <path d="M 243 261 L 253 256 L 253 266 Z" fill="currentColor" stroke="none"/>
    </g>
</svg>
