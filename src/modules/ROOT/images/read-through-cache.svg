<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="641px" height="152px" viewBox="-0.5 -0.5 641 152">
    <title>A read-through cache sitting between the application and the database, fetching from the database on a cache miss, backfilling itself, and returning the result</title>
    <g>
        <rect x="1" y="31" width="120" height="90" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="61" y="76" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Application</text>
        <rect x="261" y="31" width="120" height="90" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="321" y="76" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Cache</text>
        <path d="M 521 33 A 59 12 0 0 1 639 33 L 639 119 A 59 12 0 0 1 521 119 Z" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 521 33 A 59 12 0 0 0 639 33" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="580" y="81" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">Database</text>
        <path d="M 123 56 L 250 56" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 259 56 L 249 61 L 249 51 Z" fill="currentColor" stroke="none"/>
        <text x="191" y="44" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">1. Read</text>
        <path d="M 259 96 L 132 96" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 123 96 L 133 91 L 133 101 Z" fill="currentColor" stroke="none"/>
        <text x="191" y="84" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">4. Return</text>
        <path d="M 383 56 L 510 56" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 519 56 L 509 61 L 509 51 Z" fill="currentColor" stroke="none"/>
        <text x="451" y="44" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">2. Fetch on Miss</text>
        <path d="M 519 96 L 392 96" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 383 96 L 393 91 L 393 101 Z" fill="currentColor" stroke="none"/>
        <text x="451" y="84" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" fill="currentColor">3. Backfill</text>
    </g>
</svg>
